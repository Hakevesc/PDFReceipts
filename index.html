<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PESA PDF Receipts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Border: #E8E8EC;
    --Success: #1FC83B;
    --Gray-0: #FFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #F5F5F5;
    color: var(--On-Surface);
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .container {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--Border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    height: 36px;
    width: auto;
  }

  .header h1 {
    font-family: 'Switzer', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--On-Surface);
  }

  .header .sub {
    font-size: 13px;
    font-weight: 400;
    color: var(--On-Surface-Low);
  }

  .header-divider {
    width: 1px;
    height: 30px;
    background: var(--Border);
    flex: none;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Audience menu — Merchant today, Consumer once it exists */
  .menu { position: relative; }

  .menu-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border: 1px solid var(--Border);
    border-radius: 8px;
    background: var(--Gray-0);
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--On-Surface);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .menu-btn:hover { border-color: #D5D5DC; background: var(--Surface-Container); }

  .menu-btn[aria-expanded="true"] {
    border-color: var(--Primary);
    background: var(--Gray-0);
  }

  .menu-caret {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: var(--On-Surface-Low);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.16s ease;
  }

  .menu-btn[aria-expanded="true"] .menu-caret { transform: rotate(180deg); }

  .menu-list {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 190px;
    padding: 5px;
    border: 1px solid var(--Border);
    border-radius: 10px;
    background: var(--Gray-0);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    display: none;
    z-index: 20;
  }

  .menu.is-open .menu-list { display: block; }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 7px;
    background: none;
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--On-Surface);
    text-align: left;
    cursor: pointer;
  }

  .menu-item:hover:not([disabled]) { background: var(--Surface-Container); }

  .menu-item.is-current {
    color: var(--Primary);
    font-weight: 600;
  }

  .menu-item[disabled] {
    color: var(--On-Surface-Low);
    cursor: not-allowed;
  }

  .menu-note {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--On-Surface-Low);
    background: #F1F1F4;
    border-radius: 4px;
    padding: 2px 6px;
  }

  .count-badge {
    background: var(--Primary);
    color: #FFF;
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* Category Section */
  .category {
    margin-bottom: 20px;
    padding: 6px;
    border: 1px solid var(--Border);
    border-radius: 14px;
    background: rgba(254, 53, 61, 0.05);
    transition: box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .category:hover { border-color: #DEDEE4; }

  .category[data-open="true"] {
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.05);
  }

  .category .receipt-grid {
    padding: 4px 4px 6px;
  }

  .category-title {
    font-family: 'Switzer', sans-serif;
    font-size: 17.5px;
    font-weight: 600;
    color: var(--On-Surface);
    margin-bottom: 0;
    padding: 9px 10px;
    min-height: 46px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: none;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .category-title:hover { background: rgba(254, 53, 61, 0.06); }

  .category-title:focus-visible {
    outline: 2px solid var(--Primary);
    outline-offset: 2px;
  }

  .cat-chevron {
    margin-left: auto;
    width: 28px;
    height: 28px;
    padding: 6px;
    flex: none;
    border-radius: 50%;
    background: var(--Primary);
    fill: none;
    stroke: #FFF;
    stroke-width: 2.6;
    stroke-linecap: round;
    box-shadow: 0 1px 4px rgba(254, 53, 61, 0.30);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .category-title:hover .cat-chevron {
    background: var(--Primary-Dark);
    box-shadow: 0 2px 8px rgba(196, 21, 32, 0.38);
  }

  /* open shows a minus, closed shows a plus */
  .cat-bar-v {
    transform-origin: center;
    transition: transform 0.18s ease, opacity 0.18s ease;
    transform: scaleY(0);
    opacity: 0;
  }

  .category[data-open="false"] .cat-bar-v {
    transform: scaleY(1);
    opacity: 1;
  }

  .cat-kind { color: var(--Primary); }

  .category-title .cat-count {
    font-size: 12.5px;
    color: var(--On-Surface-Low);
    font-weight: 400;
  }

  .category[data-open="false"] .receipt-grid { display: none; }

  .receipt-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .receipt-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--Gray-0);
    border-radius: 12px;
    text-decoration: none;
    color: var(--On-Surface);
    transition: all 0.15s;
    border: 1px solid transparent;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    cursor: pointer;
  }

  .receipt-item:hover {
    border-color: var(--Primary);
    box-shadow: 0 2px 12px rgba(254, 53, 61, 0.1);
    transform: translateX(4px);
  }

  .receipt-item:active {
    transform: scale(0.99);
  }

  .receipt-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #FFF1F2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .receipt-icon svg {
    width: 18px;
    height: 18px;
    stroke: var(--Primary);
    fill: none;
    stroke-width: 2;
  }

  .receipt-info {
    flex: 1;
    min-width: 0;
  }

  .receipt-name {
    font-family: 'Switzer', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--On-Surface);
    letter-spacing: 0.1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .receipt-file {
    font-size: 11px;
    color: var(--On-Surface-Low);
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .receipt-arrow {
    width: 18px;
    height: 18px;
    stroke: var(--On-Surface-Low);
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
    transition: transform 0.15s;
  }

  .receipt-item:hover .receipt-arrow {
    transform: translateX(3px);
    stroke: var(--Primary);
  }

  /* Not applicable — shown in Customer for each Business receipt with no counterpart */
  .receipt-item.missing,
  .receipt-item.disabled {
    background: #F7F7F8;
    border: 1px dashed var(--Border);
    box-shadow: none;
    cursor: not-allowed;
    opacity: 0.65;
  }

  .receipt-item.missing:hover,
  .receipt-item.disabled:hover {
    border-color: var(--Border);
    box-shadow: none;
    transform: none;
  }

  .receipt-item.missing:active,
  .receipt-item.disabled:active { transform: none; }

  .receipt-item.missing .receipt-icon,
  .receipt-item.disabled .receipt-icon { background: #EFEFF1; }
  .receipt-item.missing .receipt-icon svg,
  .receipt-item.disabled .receipt-icon svg { stroke: var(--On-Surface-Low); }
  .receipt-item.missing .receipt-name,
  .receipt-item.disabled .receipt-name { color: var(--On-Surface-Low); }

  .missing-badge,
  .disabled-badge {
    font-family: 'Switzer', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--On-Surface-Low);
    background: #E4E4E8;
    border-radius: 4px;
    padding: 3px 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Not Applicable reads as a deliberate state, so it carries the brand
     red rather than the silver used for merely-inactive things. */
  .missing-badge {
    color: var(--Primary-Dark);
    background: #FFE1E3;
  }

  /* Footer */
  .footer-note {
    text-align: center;
    padding: 20px 0 10px;
    font-size: 12px;
    color: var(--On-Surface-Low);
    font-weight: 400;
    border-top: 1px solid var(--Border);
    margin-top: 16px;
  }

  .footer-note a {
    color: var(--Primary);
    text-decoration: none;
    font-weight: 500;
  }

  .footer-note a:hover {
    text-decoration: underline;
  }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 16px; }
    .header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .receipt-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="assets/M-PESA-red-logo.svg" alt="M-PESA" class="logo" onerror="this.style.display='none'">
      <span class="header-divider" aria-hidden="true"></span>
      <div>
        <h1>M-PESA PDF Receipts</h1>
        <div class="sub">Transaction receipts &amp; statements</div>
      </div>
    </div>

    <div class="header-right">
      <div class="menu" id="audienceMenu">
        <button class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="menu-label">Merchant</span>
          <svg class="menu-caret" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="menu-list" role="menu">
          <button class="menu-item is-current" type="button" role="menuitem" aria-current="true">
            Merchant
          </button>
          <button class="menu-item" type="button" role="menuitem" disabled aria-disabled="true">
            Consumer <span class="menu-note">not active</span>
          </button>
        </div>
      </div>
      <span class="count-badge" id="totalCount">0 receipts</span>
    </div>
  </div>

  <!-- Customer -->
  <div class="category" data-open="true">
    <button class="category-title" type="button" aria-expanded="true" aria-controls="customerList">
      <span class="cat-name"><span class="cat-kind">Customer</span> Receipt</span>
      <span class="cat-count" id="customerCount"></span>
      <svg class="cat-chevron" viewBox="0 0 24 24" aria-hidden="true"><line class="cat-bar-h" x1="5" y1="12" x2="19" y2="12"/><line class="cat-bar-v" x1="12" y1="5" x2="12" y2="19"/></svg>
    </button>
    <div class="receipt-grid" id="customerList"></div>
  </div>

  <!-- Business -->
  <div class="category" data-open="false">
    <button class="category-title" type="button" aria-expanded="false" aria-controls="businessList">
      <span class="cat-name"><span class="cat-kind">Business</span> Receipt</span>
      <span class="cat-count" id="businessCount"></span>
      <svg class="cat-chevron" viewBox="0 0 24 24" aria-hidden="true"><line class="cat-bar-h" x1="5" y1="12" x2="19" y2="12"/><line class="cat-bar-v" x1="12" y1="5" x2="12" y2="19"/></svg>
    </button>
    <div class="receipt-grid" id="businessList"></div>
  </div>


</div>

<script>
  // PDF icon SVG
  const pdfIcon = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';

  // Arrow SVG
  const arrowSvg = '<svg class="receipt-arrow" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  const receipts = [
    // ===== Customer =====
    { name: 'Agency Banking Cash In', file: 'Agency_Banking_Cashin_Receipt_Customer_Merchant.html', group: 'customer' },
    { name: 'Agency Banking Cashout', file: 'Agency_Banking_Cashout_Receipt_Customer_Merchant.html', group: 'customer' },
    { name: 'Cash In', file: 'Cashin_M-PESA_Receipt_Customer_Merchant.html', group: 'customer' },
    { name: 'Cashout', file: 'Cashout_M-PESA_Receipt_Customer_Merchant.html', group: 'customer' },
    { name: 'Pay Utility DSTV', file: 'Pay_Utility_DSTV_Receipt_Customer_Merchant.html', group: 'customer', disabled: true },
    { name: 'Pay Utility EEU', file: 'Pay_Utility_EEU_Receipt_Customer_Merchant.html', group: 'customer' },
    { name: 'Pay Utility ET', file: 'Pay_Utility_ET_Receipt_Customer_Merchant.html', group: 'customer', disabled: true },
    { name: 'Pay Utility School', file: 'Pay_Utility_School_Receipt_Customer_Merchant.html', group: 'customer' },
    { name: 'Pay Utility Water', file: 'Pay_Utility_Water_Receipt_Customer_Merchant.html', group: 'customer' },

    // ===== Business =====
    { name: 'Agency Banking Cash In', file: 'Agency_Banking_Cashin_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Agency Banking Cashout', file: 'Agency_Banking_Cashout_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Cash In', file: 'Cashin_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Cashout', file: 'Cashout_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Pay Utility DSTV', file: 'Pay_Utility_DSTV_Receipt_Business_Merchant.html', group: 'business', disabled: true },
    { name: 'Pay Utility EEU', file: 'Pay_Utility_EEU_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Pay Utility ET', file: 'Pay_Utility_ET_Receipt_Business_Merchant.html', group: 'business', disabled: true },
    { name: 'Pay Utility School', file: 'Pay_Utility_School_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Pay Utility Water', file: 'Pay_Utility_Water_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Sell Airtime', file: 'Sell_Airtime_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Sell Float', file: 'Sell_Float_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Sell Package', file: 'Sell_Package_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Distribute Float', file: 'Distribute_Float_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'EVD Print', file: 'EVD_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Voucher Via SMS', file: 'Voucher_Via_SMS_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Request Payment', file: 'Receive_Payment_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Merchant to Bank', file: 'Merchant_to_Bank_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Merchant to Merchant Transfer', file: 'Merchant_to_Merchant_Transfer_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Rollup / Collect Balance (Single Store)', file: 'Rollup_Collect_Balance_Single_Store_Receipt_Business_Merchant.html', group: 'business' },
    { name: 'Rollup / Collect Balance (All Stores)', file: 'Rollup_Collect_Balance_All_Stores_Receipt_Business_Merchant.html', group: 'business' },
  ];

  function renderList(id, items, missing = []) {
    const el = document.getElementById(id);
    if (!el) return;

    const built = items.map(r => r.disabled ? `
      <div class="receipt-item disabled" aria-disabled="true"
           title="&quot;${r.name}&quot; is turned off for now">
        <div class="receipt-icon">${pdfIcon}</div>
        <div class="receipt-info">
          <div class="receipt-name">${r.name}</div>
          <div class="receipt-file">${r.file}</div>
        </div>
        <span class="disabled-badge">Disabled</span>
      </div>
    ` : `
      <a class="receipt-item" href="${r.file}">
        <div class="receipt-icon">${pdfIcon}</div>
        <div class="receipt-info">
          <div class="receipt-name">${r.name}</div>
          <div class="receipt-file">${r.file}</div>
        </div>
        ${arrowSvg}
      </a>
    `);

    const todo = missing.map(r => `
      <div class="receipt-item missing" aria-disabled="true"
           title="&quot;${r.name}&quot; does not apply to customer receipts">
        <div class="receipt-icon">${pdfIcon}</div>
        <div class="receipt-info">
          <div class="receipt-name">${r.name}</div>
          <div class="receipt-file">${r.file.replace('_Business_', '_Customer_')}</div>
        </div>
        <span class="missing-badge">Not Applicable</span>
      </div>
    `);

    el.innerHTML = built.concat(todo).join('');
    const countEl = el.parentElement.querySelector('.cat-count');
    if (countEl) {
      const live = items.filter(r => !r.disabled).length;
      const off = items.length - live;
      const parts = [`Total ${items.length}`, `${live} Enabled`];
      if (off) parts.push(`${off} disabled`);
      if (missing.length) parts.push(`${missing.length} not applicable`);
      countEl.textContent = `(${parts.join(', ')})`;
    }
  }

  const customer = receipts.filter(r => r.group === 'customer');
  const business = receipts.filter(r => r.group === 'business');

  // Merchant-side only — these have no customer equivalent by design,
  // so they are not counted as gaps in the Customer list.
  const businessOnly = new Set([
    'Merchant to Bank',
    'Merchant to Merchant Transfer',
    'Rollup / Collect Balance (Single Store)',
    'Rollup / Collect Balance (All Stores)',
  ]);

  // Every other Business receipt with no Customer counterpart, listed as a disabled row
  const customerNames = new Set(customer.map(r => r.name));
  const missingCustomer = business.filter(
    r => !customerNames.has(r.name) && !businessOnly.has(r.name)
  );

  renderList('customerList', customer, missingCustomer);
  renderList('businessList', business);

  document.getElementById('totalCount').textContent =
    receipts.filter(r => !r.disabled).length + ' receipts';

  // Audience menu. Only Merchant exists today; Consumer is shown but inert.
  (function () {
    const menu = document.getElementById('audienceMenu');
    if (!menu) return;
    const btn = menu.querySelector('.menu-btn');
    const setOpen = (open) => {
      menu.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', String(open));
    };
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setOpen(!menu.classList.contains('is-open'));
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target)) setOpen(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setOpen(false);
    });
    menu.querySelectorAll('.menu-item:not([disabled])').forEach((item) => {
      item.addEventListener('click', () => setOpen(false));
    });
  })();

  // Categories collapse so a long list can be tucked away. The open/closed
  // choice is remembered between visits.
  document.querySelectorAll('.category').forEach((cat, i) => {
    const btn = cat.querySelector('.category-title');
    const key = 'cat-open-' + i;
    const saved = localStorage.getItem(key);
    if (saved !== null) {
      cat.dataset.open = saved;
      btn.setAttribute('aria-expanded', saved);
    }
    btn.addEventListener('click', () => {
      const open = cat.dataset.open !== 'true';
      cat.dataset.open = String(open);
      btn.setAttribute('aria-expanded', String(open));
      localStorage.setItem(key, String(open));
    });
  });
</script>
<script defer src="assets/comments-badges.js"></script>
</body>
</html>
