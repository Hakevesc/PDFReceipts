<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PESA PDF Receipts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Border: #E8E8EC;
    --Success: #1FC83B;
    --Gray-0: #FFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #F5F5F5;
    color: var(--On-Surface);
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .container {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--Border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    height: 36px;
    width: auto;
  }

  .header h1 {
    font-family: 'Switzer', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--On-Surface);
  }

  .header .sub {
    font-size: 13px;
    font-weight: 400;
    color: var(--On-Surface-Low);
  }

  .count-badge {
    background: var(--Primary);
    color: #FFF;
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* Category Section */
  .category {
    margin-bottom: 32px;
  }

  .category-title {
    font-family: 'Switzer', sans-serif;
    font-size: 17.5px;
    font-weight: 600;
    color: var(--On-Surface);
    margin-bottom: 12px;
    padding: 6px 8px 6px 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: none;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .category-title:hover { background: var(--Surface-Container); }

  .category-title:focus-visible {
    outline: 2px solid var(--Primary);
    outline-offset: 2px;
  }

  .cat-chevron {
    width: 28px;
    height: 28px;
    padding: 7px;
    flex: none;
    border-radius: 50%;
    background: var(--Primary);
    fill: none;
    stroke: #FFF;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    box-shadow: 0 1px 4px rgba(254, 53, 61, 0.30);
    transform: rotate(90deg);
    transition: transform 0.18s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .category-title:hover .cat-chevron {
    background: var(--Primary-Dark);
    box-shadow: 0 2px 8px rgba(196, 21, 32, 0.38);
  }

  .category[data-open="false"] .cat-chevron { transform: rotate(0deg); }

  .category-title .cat-count {
    font-size: 12.5px;
    color: var(--On-Surface-Low);
    font-weight: 400;
  }

  .category[data-open="false"] .receipt-grid { display: none; }

  .receipt-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .receipt-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--Gray-0);
    border-radius: 12px;
    text-decoration: none;
    color: var(--On-Surface);
    transition: all 0.15s;
    border: 1px solid transparent;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    cursor: pointer;
  }

  .receipt-item:hover {
    border-color: var(--Primary);
    box-shadow: 0 2px 12px rgba(254, 53, 61, 0.1);
    transform: translateX(4px);
  }

  .receipt-item:active {
    transform: scale(0.99);
  }

  .receipt-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #FFF1F2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .receipt-icon svg {
    width: 18px;
    height: 18px;
    stroke: var(--Primary);
    fill: none;
    stroke-width: 2;
  }

  .receipt-info {
    flex: 1;
    min-width: 0;
  }

  .receipt-name {
    font-family: 'Switzer', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--On-Surface);
    letter-spacing: 0.1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .receipt-file {
    font-size: 11px;
    color: var(--On-Surface-Low);
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .receipt-arrow {
    width: 18px;
    height: 18px;
    stroke: var(--On-Surface-Low);
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
    transition: transform 0.15s;
  }

  .receipt-item:hover .receipt-arrow {
    transform: translateX(3px);
    stroke: var(--Primary);
  }

  /* Not applicable — shown in Customer for each Business receipt with no counterpart */
  .receipt-item.missing,
  .receipt-item.disabled {
    background: #F7F7F8;
    border: 1px dashed var(--Border);
    box-shadow: none;
    cursor: not-allowed;
    opacity: 0.65;
  }

  .receipt-item.missing:hover,
  .receipt-item.disabled:hover {
    border-color: var(--Border);
    box-shadow: none;
    transform: none;
  }

  .receipt-item.missing:active,
  .receipt-item.disabled:active { transform: none; }

  .receipt-item.missing .receipt-icon,
  .receipt-item.disabled .receipt-icon { background: #EFEFF1; }
  .receipt-item.missing .receipt-icon svg,
  .receipt-item.disabled .receipt-icon svg { stroke: var(--On-Surface-Low); }
  .receipt-item.missing .receipt-name,
  .receipt-item.disabled .receipt-name { color: var(--On-Surface-Low); }

  .missing-badge,
  .disabled-badge {
    font-family: 'Switzer', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--On-Surface-Low);
    background: #E4E4E8;
    border-radius: 4px;
    padding: 3px 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Footer */
  .footer-note {
    text-align: center;
    padding: 20px 0 10px;
    font-size: 12px;
    color: var(--On-Surface-Low);
    font-weight: 400;
    border-top: 1px solid var(--Border);
    margin-top: 16px;
  }

  .footer-note a {
    color: var(--Primary);
    text-decoration: none;
    font-weight: 500;
  }

  .footer-note a:hover {
    text-decoration: underline;
  }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 16px; }
    .header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .receipt-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="assets/M-PESA-red-logo.svg" alt="M-PESA" class="logo" onerror="this.style.display='none'">
      <div>
        <h1>M-PESA PDF Receipts</h1>
        <div class="sub">M-PESA transaction receipts & statements</div>
      </div>
    </div>
    <span class="count-badge" id="totalCount">0 receipts</span>
  </div>

  <!-- Customer -->
  <div class="category" data-open="true">
    <button class="category-title" type="button" aria-expanded="true" aria-controls="customerList">
      <svg class="cat-chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      <span class="cat-name">Merchant | Customer Receipt</span>
      <span class="cat-count" id="customerCount"></span>
    </button>
    <div class="receipt-grid" id="customerList"></div>
  </div>

  <!-- Business -->
  <div class="category" data-open="true">
    <button class="category-title" type="button" aria-expanded="true" aria-controls="businessList">
      <svg class="cat-chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      <span class="cat-name">Merchant | Business Receipt</span>
      <span class="cat-count" id="businessCount"></span>
    </button>
    <div class="receipt-grid" id="businessList"></div>
  </div>

  <div class="footer-note">
    M-PESA — <a href="index.html">Home</a>
  </div>

</div>

<script>
  // PDF icon SVG
  const pdfIcon = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';

  // Arrow SVG
  const arrowSvg = '<svg class="receipt-arrow" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  const receipts = [
    // ===== Customer =====
    { name: 'Agency Banking Cash In', file: 'Agency Banking Cashin Recipet PDF.html', group: 'customer' },
    { name: 'Agency Banking Cashout', file: 'Agency Banking Cashout Recipet PDF.html', group: 'customer' },
    { name: 'Cash In', file: 'Cashin M-PESA_Customer.html', group: 'customer' },
    { name: 'Cashout', file: 'Cashout M-PESA_Customer.html', group: 'customer' },
    { name: 'Pay Utility DSTV', file: 'Pay Utility DSTV_Customer.html', group: 'customer', disabled: true },
    { name: 'Pay Utility EEU', file: 'Pay Utility EEU_Customer.html', group: 'customer' },
    { name: 'Pay Utility ET', file: 'Pay Utility ET_Customer.html', group: 'customer', disabled: true },
    { name: 'Pay Utility School', file: 'Pay Utility School_Customer.html', group: 'customer' },
    { name: 'Pay Utility Water', file: 'Pay Utility Water_Customer.html', group: 'customer' },

    // ===== Business =====
    { name: 'Agency Banking Cash In', file: 'Agency Banking Cashin_Business.html', group: 'business' },
    { name: 'Agency Banking Cashout', file: 'Agency Banking Cashout_Business.html', group: 'business' },
    { name: 'Cash In', file: 'Cashin Recipet PDF.html', group: 'business' },
    { name: 'Cashout', file: 'Cashout Recipet PDF.html', group: 'business' },
    { name: 'Pay Utility DSTV', file: 'Pay Utility DSTV Recipet PDF.html', group: 'business', disabled: true },
    { name: 'Pay Utility EEU', file: 'Pay Utility EEU Recipet PDF.html', group: 'business' },
    { name: 'Pay Utility ET', file: 'Pay Utility Recipet PDF.html', group: 'business', disabled: true },
    { name: 'Pay Utility School', file: 'Pay Utility School Recipet PDF.html', group: 'business' },
    { name: 'Pay Utility Water', file: 'Pay Utility Water Recipet PDF.html', group: 'business' },
    { name: 'Sell Airtime', file: 'Sell Airtime Recipet PDF.html', group: 'business' },
    { name: 'Sell Float', file: 'Sell Float Recipet PDF.html', group: 'business' },
    { name: 'Sell Package', file: 'Sell Package Recipet PDF.html', group: 'business' },
    { name: 'Distribute Float', file: 'Distribute Float Recipet PDF.html', group: 'business' },
    { name: 'EVD Print', file: 'EVD Receipt Business.html', group: 'business' },
    { name: 'Voucher Via SMS', file: 'Voucher Via SMS business.html', group: 'business' },
    { name: 'Request Payment', file: 'Receive Payment Business.html', group: 'business' },
    { name: 'Merchant to Bank', file: 'Merchant to Bank PDF.html', group: 'business' },
    { name: 'Merchant to Merchant Transfer', file: 'Merchant to Merchant Transfer Receipt PDF.html', group: 'business' },
    { name: 'Rollup / Collect Balance (Single Store)', file: 'Rollup Collect Balance Single Store PDF.html', group: 'business' },
    { name: 'Rollup / Collect Balance (All Stores)', file: 'Rollup Collect Balance All Stores PDF.html', group: 'business' },
  ];

  function renderList(id, items, missing = []) {
    const el = document.getElementById(id);
    if (!el) return;

    const built = items.map(r => r.disabled ? `
      <div class="receipt-item disabled" aria-disabled="true"
           title="&quot;${r.name}&quot; is turned off for now">
        <div class="receipt-icon">${pdfIcon}</div>
        <div class="receipt-info">
          <div class="receipt-name">${r.name}</div>
          <div class="receipt-file">${r.file}</div>
        </div>
        <span class="disabled-badge">Disabled</span>
      </div>
    ` : `
      <a class="receipt-item" href="${r.file}">
        <div class="receipt-icon">${pdfIcon}</div>
        <div class="receipt-info">
          <div class="receipt-name">${r.name}</div>
          <div class="receipt-file">${r.file}</div>
        </div>
        ${arrowSvg}
      </a>
    `);

    const todo = missing.map(r => `
      <div class="receipt-item missing" aria-disabled="true"
           title="&quot;${r.name}&quot; does not apply to customer receipts">
        <div class="receipt-icon">${pdfIcon}</div>
        <div class="receipt-info">
          <div class="receipt-name">${r.name}</div>
          <div class="receipt-file">not applicable</div>
        </div>
        <span class="missing-badge">Not Applicable</span>
      </div>
    `);

    el.innerHTML = built.concat(todo).join('');
    const countEl = el.parentElement.querySelector('.cat-count');
    if (countEl) {
      const live = items.filter(r => !r.disabled).length;
      const off = items.length - live;
      const parts = [`Total ${items.length}`, `${live} Enabled`];
      if (off) parts.push(`${off} disabled`);
      if (missing.length) parts.push(`${missing.length} not applicable`);
      countEl.textContent = `(${parts.join(', ')})`;
    }
  }

  const customer = receipts.filter(r => r.group === 'customer');
  const business = receipts.filter(r => r.group === 'business');

  // Merchant-side only — these have no customer equivalent by design,
  // so they are not counted as gaps in the Customer list.
  const businessOnly = new Set([
    'Merchant to Bank',
    'Merchant to Merchant Transfer',
    'Rollup / Collect Balance (Single Store)',
    'Rollup / Collect Balance (All Stores)',
  ]);

  // Every other Business receipt with no Customer counterpart, listed as a disabled row
  const customerNames = new Set(customer.map(r => r.name));
  const missingCustomer = business.filter(
    r => !customerNames.has(r.name) && !businessOnly.has(r.name)
  );

  renderList('customerList', customer, missingCustomer);
  renderList('businessList', business);

  document.getElementById('totalCount').textContent =
    receipts.filter(r => !r.disabled).length + ' Merchant receipts';

  // Categories collapse so a long list can be tucked away. The open/closed
  // choice is remembered between visits.
  document.querySelectorAll('.category').forEach((cat, i) => {
    const btn = cat.querySelector('.category-title');
    const key = 'cat-open-' + i;
    const saved = localStorage.getItem(key);
    if (saved !== null) {
      cat.dataset.open = saved;
      btn.setAttribute('aria-expanded', saved);
    }
    btn.addEventListener('click', () => {
      const open = cat.dataset.open !== 'true';
      cat.dataset.open = String(open);
      btn.setAttribute('aria-expanded', String(open));
      localStorage.setItem(key, String(open));
    });
  });
</script>
<script defer src="assets/comments-badges.js"></script>
</body>
</html>
