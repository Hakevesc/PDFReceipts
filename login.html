<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — M-PESA Receipts</title>
<!-- ?v= is a cache buster. Bump it whenever auth.js or auth.css changes, or
     browsers that already hold a copy will keep running the old one. -->
<link rel="stylesheet" href="assets/auth.css?v=4">
<script src="assets/auth.js?v=4" data-login></script>
</head>
<body class="rc-login-body">

<main class="rc-login">
  <img src="assets/M-PESA-red-logo.svg" alt="M-PESA" class="rc-login-logo"
       onerror="this.style.display='none'">

  <h1>Review the receipts</h1>
  <p class="rc-login-sub">Sign in with your username and password</p>

  <div class="rc-card">

    <!-- Step 1 — username and password.
         The accounts are made by hand in supabase-team-users.sql, so everyone
         has a password before they ever open this page and nothing has to be
         emailed for them to get in. That is why this is the first step rather
         than the fallback it used to be: the mail is the part that breaks. -->
    <form id="signinStep" novalidate>
      <input class="rc-field" id="username" type="text" name="username"
             placeholder="Username" autocomplete="username"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <input class="rc-field" id="password" type="password" name="password"
             placeholder="Password" autocomplete="current-password" required>
      <button class="rc-submit" id="signinSubmit" type="submit">Sign in</button>
      <div class="rc-alt">
        <button class="rc-textlink" id="codeLink" type="button">Email me a code instead</button>
      </div>
    </form>

    <!-- Step 2 — six-digit code.
         Kept for the day custom SMTP is switched on, and for anyone who would
         rather not hold a password. It grants nothing extra: the session it
         produces is the same one the password produces, and every policy still
         re-checks the members row. Access is the row, never the door. -->
    <form id="codeStep" novalidate hidden>
      <p class="rc-sent">We sent a <span id="codeLen">6</span>-digit code to <b id="sentTo"></b>.<br>It expires in 10 minutes.</p>
      <!-- Boxes are built from receiptAuth.config.codeLength so the page
           always matches whatever Supabase is set to send. -->
      <div class="rc-code" id="codeBoxes"></div>
      <button class="rc-submit" id="codeSubmit" type="submit">Verify and continue</button>
      <div class="rc-alt">
        <button class="rc-textlink" id="backBtn" type="button">Back to sign in</button>
        <button class="rc-textlink" id="resendBtn" type="button">Resend code</button>
      </div>
    </form>

    <div class="rc-note" id="note" role="status" hidden></div>
  </div>

  <p class="rc-login-foot">M-PESA receipt review · internal</p>
</main>

<script>
(function () {
  'use strict';

  const auth       = window.receiptAuth;

  const signinStep = document.getElementById('signinStep');
  const userInput  = document.getElementById('username');
  const pwInput    = document.getElementById('password');
  const signinBtn  = document.getElementById('signinSubmit');
  const codeLink   = document.getElementById('codeLink');

  const codeStep   = document.getElementById('codeStep');
  const codeBtn    = document.getElementById('codeSubmit');
  const backBtn    = document.getElementById('backBtn');
  const resendBtn  = document.getElementById('resendBtn');
  const sentTo     = document.getElementById('sentTo');
  const note       = document.getElementById('note');

  // Supabase decides how long the code is; the page follows it rather than
  // assuming six. Mismatch here is the difference between a code that can be
  // typed and one that silently cannot.
  const LEN = (auth && auth.config && auth.config.codeLength) || 6;
  document.getElementById('codeLen').textContent = String(LEN);

  const codeBoxes = document.getElementById('codeBoxes');
  const boxes = [];
  for (var d = 0; d < LEN; d++) {
    var input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.maxLength = 1;
    input.setAttribute('aria-label', 'Digit ' + (d + 1));
    if (d === 0) input.autocomplete = 'one-time-code';
    codeBoxes.appendChild(input);
    boxes.push(input);
  }

  let email = '';
  let cooling = 0;
  let coolTimer = null;

  /* ------------------------------------------------------------- notices */

  function say(text, kind) {
    note.textContent = text;
    note.className = 'rc-note ' + (kind === 'ok' ? 'is-ok' : 'is-error');
    note.hidden = false;
  }

  function clearNote() { note.hidden = true; }

  /* ------------------------------------------------------------- stepping
     Two panels, one visible at a time. Kept in one place so a new step can
     never leave an old one on screen. */

  function showStep(which) {
    signinStep.hidden = which !== 'signin';
    codeStep.hidden   = which !== 'code';
  }

  /* -------------------------------------------------------------- who
     The typed username turned into the address Supabase knows, and refused
     here if it is not one we allow. Checked in Postgres too — this copy only
     saves a wasted request. */

  function readUsername() {
    const value = auth.toEmail(userInput.value);
    if (!value) {
      say('Enter your username.');
      userInput.focus();
      return '';
    }
    if (!auth.isAllowedEmail(value)) {
      say('That is not a Safaricom account. Use your username, or the whole ' +
          '@safaricom.et address.');
      userInput.focus();
      userInput.select();
      return '';
    }
    return value;
  }

  /* ------------------------------------------------------------ where to */

  // Only ever a bare filename from this origin — safeNext() drops anything
  // with a slash, scheme or host, so ?next= cannot bounce you off-site.
  function destination() {
    const raw = new URLSearchParams(location.search).get('next');
    return (auth && auth.safeNext(raw)) || 'index.html';
  }

  /* ---------------------------------------------------------- the register
     One row in public.sign_ins per successful sign-in, so the roster can
     answer "who has actually been in" rather than only "who is on the list".

     The address is not sent — rc_log_sign_in() reads it out of the verified
     session, so the browser cannot write a row under someone else's name. All
     we hand over is which door was used.

     Never allowed to stop a sign-in. If the call fails, the person is already
     signed in and the only casualty is one missing line in a log. */

  async function recordSignIn(method) {
    try {
      const client = await auth.getClient();
      await client.rpc('rc_log_sign_in', {
        p_method: method,
        p_user_agent: String(navigator.userAgent || '').slice(0, 400)
      });
    } catch (_) { /* the register is bookkeeping, not a gate */ }
  }

  /* ------------------------------------------------- step 1 — the password */

  signinStep.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearNote();

    const who = readUsername();
    if (!who) return;

    const secret = pwInput.value;
    if (!secret) { say('Enter your password.'); pwInput.focus(); return; }

    signinBtn.disabled = true;
    signinBtn.textContent = 'Signing in…';

    try {
      const client = await auth.getClient();
      const { data, error } = await client.auth.signInWithPassword({
        email: who, password: secret
      });

      if (error || !data || !data.session) {
        signinBtn.disabled = false;
        signinBtn.textContent = 'Sign in';
        say(error ? friendly(error) : 'That password did not work. Try again.');
        pwInput.value = '';
        pwInput.focus();
        return;
      }
      email = who;
      await recordSignIn('password');
      location.replace(destination());
    } catch (err) {
      signinBtn.disabled = false;
      signinBtn.textContent = 'Sign in';
      say('Could not reach the sign-in service. Check your connection and try again.');
    }
  });

  /* ------------------------------------------------------ the other door */

  async function sendCode(address) {
    try {
      const client = await auth.getClient();
      const { error } = await client.auth.signInWithOtp({
        email: address,
        options: { shouldCreateUser: false }
      });
      if (error) { say(friendly(error)); return false; }
      return true;
    } catch (err) {
      say('Could not reach the sign-in service. Check your connection and try again.');
      return false;
    }
  }

  codeLink.addEventListener('click', async function () {
    clearNote();

    const who = readUsername();
    if (!who) return;

    codeLink.disabled = true;
    codeLink.textContent = 'Sending…';
    const sent = await sendCode(who);
    codeLink.disabled = false;
    codeLink.textContent = 'Email me a code instead';
    if (!sent) return;

    email = who;
    sentTo.textContent = who;
    pwInput.value = '';
    showStep('code');
    say('Code sent. Check your inbox, and your spam folder.', 'ok');
    startCooldown();
    boxes[0].focus();
  });

  /* -------------------------------------------------- step 2 — the code */

  codeStep.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearNote();

    const token = boxes.map(function (b) { return b.value.trim(); }).join('');
    if (token.length !== LEN) { say('Enter all ' + LEN + ' digits.'); return; }

    codeBtn.disabled = true;
    codeBtn.textContent = 'Verifying…';

    try {
      const client = await auth.getClient();

      // A first-time address gets Supabase's "Confirm signup" mail, an
      // existing one gets "Magic Link". The generic 'email' type covers both
      // on current supabase-js, but fall back to 'signup' so a brand-new
      // reviewer is never stuck on their very first code.
      let { data, error } = await client.auth.verifyOtp({
        email: email, token: token, type: 'email'
      });
      if (error && !(data && data.session)) {
        const retry = await client.auth.verifyOtp({
          email: email, token: token, type: 'signup'
        });
        if (retry.data && retry.data.session) { data = retry.data; error = null; }
      }

      if (error || !data || !data.session) {
        codeBtn.disabled = false;
        codeBtn.textContent = 'Verify and continue';
        say(error ? friendly(error) : 'That code did not work. Try again.');
        boxes.forEach(function (b) { b.value = ''; });
        boxes[0].focus();
        return;
      }
      await recordSignIn('code');
      location.replace(destination());
    } catch (err) {
      codeBtn.disabled = false;
      codeBtn.textContent = 'Verify and continue';
      say('Could not reach the sign-in service. Check your connection and try again.');
    }
  });

  /* --------------------------------------------------------- code boxes */

  boxes.forEach(function (box, i) {
    box.addEventListener('input', function () {
      box.value = box.value.replace(/\D/g, '').slice(0, 1);
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      if (boxes.every(function (b) { return b.value; })) codeBtn.focus();
    });

    box.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !box.value && i > 0) {
        boxes[i - 1].focus();
        boxes[i - 1].value = '';
        e.preventDefault();
      }
      if (e.key === 'ArrowLeft' && i > 0) { boxes[i - 1].focus(); e.preventDefault(); }
      if (e.key === 'ArrowRight' && i < boxes.length - 1) { boxes[i + 1].focus(); e.preventDefault(); }
    });

    // Pasting the whole code into any box fills the row.
    box.addEventListener('paste', function (e) {
      const text = (e.clipboardData || window.clipboardData).getData('text') || '';
      const digits = text.replace(/\D/g, '').slice(0, LEN);
      if (!digits) return;
      e.preventDefault();
      boxes.forEach(function (b, n) { b.value = digits[n] || ''; });
      const next = Math.min(digits.length, boxes.length - 1);
      boxes[next].focus();
    });
  });

  /* ------------------------------------------------------------- resend */

  function startCooldown() {
    cooling = 60;
    tick();
    clearInterval(coolTimer);
    coolTimer = setInterval(tick, 1000);
  }

  function tick() {
    if (cooling <= 0) {
      clearInterval(coolTimer);
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend code';
      return;
    }
    resendBtn.disabled = true;
    resendBtn.textContent = 'Resend in ' + cooling + 's';
    cooling -= 1;
  }

  resendBtn.addEventListener('click', async function () {
    if (resendBtn.disabled || !email) return;
    clearNote();
    resendBtn.disabled = true;
    resendBtn.textContent = 'Sending…';
    const sent = await sendCode(email);
    if (sent) say('New code sent.', 'ok');
    startCooldown();
  });

  backBtn.addEventListener('click', function () {
    clearInterval(coolTimer);
    clearNote();
    email = '';
    boxes.forEach(function (b) { b.value = ''; });
    showStep('signin');
    userInput.focus();
    userInput.select();
  });

  /* ------------------------------------------------------------- errors */

  // The mail failures are spelled out on purpose. They are the ones that look
  // like "the site is broken for me but works for him", and the person seeing
  // them cannot fix them — so the message has to say what is wrong, who fixes
  // it, and what to do in the meantime.
  function friendly(error) {
    const raw = (error && error.message ? error.message : String(error)).toLowerCase();

    // Wrong password, as opposed to a wrong code — both come back as "invalid".
    // First, because it is now the common case: it is also what an account
    // that was never created answers, which is why the wording covers both.
    if (raw.indexOf('invalid login credentials') !== -1) {
      return 'That username and password do not match, or the account does ' +
             'not exist yet. Check them, or ask Mikias Dereje to set you up.';
    }

    // Supabase's built-in mailer refuses any recipient who is not a member of
    // the project team. It is the usual reason one address gets codes and no
    // other does. Only custom SMTP cures it.
    if (raw.indexOf('not authorized') !== -1) {
      return 'The mail service refused to send to that address, because custom ' +
             'SMTP is not switched on for this project. Sign in with your ' +
             'password instead, or ask Mikias Dereje to turn SMTP on.';
    }

    // SMTP is configured but the handoff failed — a revoked Gmail app password
    // is the common cause.
    if (raw.indexOf('error sending') !== -1 || raw.indexOf('smtp') !== -1) {
      return 'The code could not be emailed — the mail service rejected it. ' +
             'Sign in with your password instead, and tell Mikias Dereje the ' +
             'SMTP password needs checking.';
    }

    if (raw.indexOf('rate limit') !== -1 || raw.indexOf('too many') !== -1 ||
        raw.indexOf('for security purposes') !== -1) {
      return 'Too many attempts for now. Wait a minute, then try again.';
    }

    // shouldCreateUser is false, so a code is only ever sent to an account
    // that already exists. An unknown username lands here.
    if (raw.indexOf('signups not allowed') !== -1 ||
        raw.indexOf('signup is disabled') !== -1 ||
        raw.indexOf('signup_disabled') !== -1 ||
        raw.indexOf('user not found') !== -1) {
      return 'There is no account for that username yet. Ask Mikias Dereje ' +
             'to add you.';
    }
    if (raw.indexOf('expired') !== -1) {
      return 'That code has expired. Send a new one.';
    }
    if (raw.indexOf('email not confirmed') !== -1) {
      return 'That account has not been confirmed yet. Ask Mikias Dereje to ' +
             'confirm it in Supabase.';
    }
    if (raw.indexOf('invalid') !== -1 || raw.indexOf('token') !== -1) {
      return 'That code is not right. Check it and try again.';
    }
    return error && error.message ? error.message : 'Something went wrong. Try again.';
  }

  /* --------------------------------------------------------------- boot */

  const REASONS = {
    expired: 'Your session ended. Sign in again.',
    domain:  'That account is not a Safaricom address.',
    revoked: 'Your access to the receipt review has been removed. ' +
             'Ask Mikias Dereje if you think this is a mistake.'
  };

  const reason = new URLSearchParams(location.search).get('reason');
  if (REASONS[reason]) say(REASONS[reason]);

  // Already signed in? Skip the form entirely.
  auth.ready.then(function (a) {
    if (a.signedIn) { location.replace(destination()); return; }
    if (a.error && REASONS[a.error]) say(REASONS[a.error]);
    else if (a.error) say(a.error);
  });

  userInput.focus();
})();
</script>

</body>
</html>
